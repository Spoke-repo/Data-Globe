apiVersion: apps/v1
kind: Deployment
metadata:
  name: company-data-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: company-data-api
  template:
    metadata:
      labels:
        app: company-data-api
    spec:
      containers:
        - name: api
          image: ACR_NAME.azurecr.io/company-data-api:latest   # replaced by the pipeline
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: company-data-api
spec:
  selector:
    app: company-data-api
  ports:
    - port: 80
      targetPort: 8080
