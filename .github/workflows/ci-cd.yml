name: CI-CD (basic)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 app tests --max-line-length=120

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=xml

  package:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create deployment zip
        run: zip -r app.zip app requirements.txt

      - uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip
          retention-days: 1

  deploy-dev:
    needs: package
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_DEV }}
          package: app.zip

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            curl -fs https://${{ vars.WEBAPP_DEV }}.azurewebsites.net/health && exit 0
            sleep 10
          done
          exit 1
