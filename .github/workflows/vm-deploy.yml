
name: Flask CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://testuser:testpassword@localhost:5432/testdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest pytest-cov flake8

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize test database
        run: |
          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE customers (
                  id SERIAL PRIMARY KEY,
                  name TEXT NOT NULL,
                  region TEXT
                );"

          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE sales (
                  customer_id INTEGER REFERENCES customers(id),
                  amount NUMERIC(12,2) NOT NULL
                );"

          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -v ON_ERROR_STOP=1 \
            -c "INSERT INTO customers (id, name, region) VALUES
                  (1, 'Customer A', 'North'),
                  (2, 'Customer B', 'South'),
                  (3, 'Customer C', 'West');"

          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -v ON_ERROR_STOP=1 \
            -c "INSERT INTO sales (customer_id, amount) VALUES
                  (1, 1000.00),
                  (2, 1440.75),
                  (3, 1000.00);"

      - name: Lint
        run: python -m flake8 app tests --max-line-length=120

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package Flask Application
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create deployment package
        run: |
          test -f app/requirements.txt
          zip -r app.zip app \
            -x "app/**/__pycache__/*" \
               "app/**/*.pyc" \
               "app/**/.pytest_cache/*"

          echo "Deployment package contents:"
          unzip -l app.zip

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip
          retention-days: 1
