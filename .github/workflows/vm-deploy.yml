
name: Flask CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://testuser:testpassword@localhost:5432/testdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest pytest-cov flake8

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Initialize test database
        run: |
          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE customers (
                  id SERIAL PRIMARY KEY,
                  name TEXT NOT NULL,
                  region TEXT
                );"

          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE sales (
                  customer_id INTEGER REFERENCES customers(id),
                  amount NUMERIC(12,2) NOT NULL
                );"

          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -v ON_ERROR_STOP=1 \
            -c "INSERT INTO customers (id, name, region) VALUES
                  (1, 'Customer A', 'North'),
                  (2, 'Customer B', 'South'),
                  (3, 'Customer C', 'West');"

          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -v ON_ERROR_STOP=1 \
            -c "INSERT INTO sales (customer_id, amount) VALUES
                  (1, 1000.00),
                  (2, 1440.75),
                  (3, 1000.00);"

      - name: Lint
        run: python -m flake8 app tests --max-line-length=120

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

  package:
    name: Package Flask Application
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create deployment package
        run: |
          test -f app/requirements.txt
          zip -r app.zip app \
            -x "app/**/__pycache__/*" \
               "app/**/*.pyc" \
               "app/**/.pytest_cache/*"

          echo "Deployment package contents:"
          unzip -l app.zip

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip
          retention-days: 1

          
  deploy-vm:
    name: Deploy to Azure Linux VM
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download application package
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Validate deployment configuration
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          test -f app.zip
          test -n "$VM_HOST" || { echo "Missing VM_HOST variable"; exit 1; }
          test -n "$VM_USER" || { echo "Missing VM_USER variable"; exit 1; }
          test -n "$VM_SSH_PRIVATE_KEY" || { echo "Missing SSH private key secret"; exit 1; }
          test -n "$VM_SSH_KNOWN_HOSTS" || { echo "Missing SSH known-hosts secret"; exit 1; }

      - name: Configure SSH
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" "echo SSH connection successful"

      - name: Transfer application package
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            app.zip "${VM_USER}@${VM_HOST}:/tmp/app-${GITHUB_SHA}.zip"

      - name: Deploy and verify application
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" \
            "sudo /usr/local/sbin/deploy-myflaskapp '${GITHUB_SHA}'"

          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" \
            "curl -fsS --max-time 10 http://127.0.0.1:8080/health"
