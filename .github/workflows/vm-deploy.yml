
name: CI-CD (Azure VM)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================
  # TEST
  # ============================================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install flake8 pytest pytest-cov

      - name: Lint
        run: |
          python -m flake8 app tests --max-line-length=120

      - name: Run tests
        run: |
          python -m pytest --cov=app --cov-report=xml

  # ============================================================
  # PACKAGE
  # ============================================================
  package:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create deployment package
        run: |
          test -f app/requirements.txt
          zip -r app.zip app \
            -x "app/**/__pycache__/*" \
               "app/**/*.pyc" \
               "app/**/.pytest_cache/*"

          echo "Deployment package contents:"
          unzip -l app.zip

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip
          retention-days: 1

  # ============================================================
  # DEPLOY TO AZURE VM
  # ============================================================
  deploy-dev:
    needs: package
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Validate deployment configuration
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VM_HOST" || {
            echo "Missing environment variable: VM_HOST"
            exit 1
          }

          test -n "$VM_USER" || {
            echo "Missing environment variable: VM_USER"
            exit 1
          }

          test -n "$VM_SSH_PRIVATE_KEY" || {
            echo "Missing secret: VM_SSH_PRIVATE_KEY"
            exit 1
          }

          test -n "$VM_SSH_KNOWN_HOSTS" || {
            echo "Missing secret: VM_SSH_KNOWN_HOSTS"
            exit 1
          }

          test -f app.zip

      - name: Configure SSH
        env:
          VM_SSH_PRIVATE_KEY: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          VM_SSH_KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$VM_SSH_PRIVATE_KEY" \
            > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$VM_SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify SSH connectivity
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" \
            "echo 'SSH connection successful'"

      - name: Transfer application package
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
        run: |
          scp -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            app.zip \
            "${VM_USER}@${VM_HOST}:/tmp/app-${GITHUB_SHA}.zip"

      - name: Deploy application on VM
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" \
            "sudo /usr/local/sbin/deploy-myflaskapp '${GITHUB_SHA}'"

      - name: Verify application health on VM
        env:
          VM_HOST: ${{ vars.VM_HOST }}
          VM_USER: ${{ vars.VM_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${VM_USER}@${VM_HOST}" \
            "curl -fsS --max-time 10 http://127.0.0.1:8080/health"
