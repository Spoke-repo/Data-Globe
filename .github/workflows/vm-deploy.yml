
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://testuser:testpassword@localhost:5432/testdb

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt
          python -m pip install pytest pytest-cov

      - name: Initialize test database
        run: |
          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -c "CREATE TABLE customers (id SERIAL PRIMARY KEY, name TEXT NOT NULL, region TEXT);"

          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -c "CREATE TABLE sales (customer_id INTEGER REFERENCES customers(id), amount NUMERIC(12,2) NOT NULL);"

          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -c "INSERT INTO customers (id, name, region) VALUES (1, 'Customer A', 'North'), (2, 'Customer B', 'South'), (3, 'Customer C', 'West');"

          PGPASSWORD=testpassword psql \
            -h localhost -U testuser -d testdb \
            -c "INSERT INTO sales (customer_id, amount) VALUES (1, 1000.00), (2, 1440.75), (3, 1000.00);"

      - name: Run tests
        run: python -m pytest --cov=app --cov-report=xml
